name: Go native build and installers
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, beta, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: 3.0.0-dev
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - id: version
        shell: bash
        run: echo "value=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version || '3.0.0-dev' }}
      - run: node build/frontend.mjs
        env:
          NUXT_PUBLIC_APP_VERSION: ${{ inputs.version || '3.0.0-dev' }}
      - run: npm --prefix frontend run typecheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: internal/web/dist
  native:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    env:
      OSTRM_VERSION: ${{ needs.frontend.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend
          path: internal/web/dist
      - run: go vet ./...
      - run: go test ./...
      - if: matrix.os != 'windows'
        run: go test -race ./...
      - run: node build/build.mjs ${{ matrix.os }}/${{ matrix.arch }}
      - run: node tests/packaging/smoke.mjs dist/ostrm_${{ env.OSTRM_VERSION }}_${{ matrix.os }}_${{ matrix.arch }}/ostrm${{ matrix.os == 'windows' && '.exe' || '' }}
      - if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
          OSTRM_BINARY="$GITHUB_WORKSPACE/dist/ostrm_${OSTRM_VERSION}_linux_amd64/ostrm" npx playwright test
      - if: matrix.os == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo apt-get update
          sudo apt-get install -y rpm
      - run: node build/package.mjs ${{ matrix.os }} ${{ matrix.arch }}
      - if: matrix.os != 'windows'
        run: bash tests/packaging/install.sh "$OSTRM_VERSION" '${{ matrix.arch }}'
      - if: matrix.os == 'windows'
        run: ./tests/packaging/install.ps1 -Version $env:OSTRM_VERSION -Arch '${{ matrix.arch }}'
      - shell: bash
        run: echo '{"os":"${{ matrix.os }}","arch":"${{ matrix.arch }}","nativeTested":true,"installerTested":true,"signed":false}' > dist/${{ matrix.os }}-${{ matrix.arch }}-tested.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*_setup.exe
            dist/*-tested.json
