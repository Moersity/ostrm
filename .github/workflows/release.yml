name: Release native installers
on:
  pull_request:
    types: [closed]
    branches: [beta, main]
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,re
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']));p=e['pull_request']
          head=p['head'];base=p['base'];repo=os.environ['GITHUB_REPOSITORY']
          assert head['repo']['full_name']==repo==base['repo']['full_name']
          assert (head['ref'],base['ref']) in [('dev','beta'),('beta','main')]
          pre=base['ref']=='beta';v=json.load(open('app_version.json'))['beta_version' if pre else 'release_version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?',v)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'version={v}\nprerelease={str(pre).lower()}\n')
          PY
  build:
    needs: validate
    uses: ./.github/workflows/go-ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - run: git archive --format=tar.gz --output=dist/SOURCE.tar.gz HEAD
      - run: node build/verify-release.mjs
        env:
          OSTRM_VERSION: ${{ needs.validate.outputs.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRE: ${{ needs.validate.outputs.prerelease }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$SHA" ]; then echo 'Tag points to another commit'; exit 1; fi
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if [ "$(cat draft-state.txt)" != true ]; then echo 'Release already published; assets are immutable'; exit 1; fi
          else
            printf 'OStrm Go %s\n\n' "$VERSION" > release-notes.md
            cat RELEASE-NOTES.md >> release-notes.md
            gh release create "$tag" --target "$SHA" --draft --title "OStrm Go $VERSION" --notes-file release-notes.md
          fi
          # No clobber: a partial upload is reviewed rather than silently replaced.
          gh release upload "$tag" dist/*
          if [ "$PRE" = true ]; then gh release edit "$tag" --draft=false --prerelease --latest=false; else gh release edit "$tag" --draft=false --latest; fi
