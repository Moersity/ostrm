name: Release native installers
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-release-main
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests/release -p 'test_*.py'
      - id: version
        run: python3 build/release.py plan
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          overwrite: true
          path: release-plan.json
  build:
    needs: validate
    if: needs.validate.outputs.published != 'true'
    uses: ./.github/workflows/go-ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  publish:
    needs: [validate, build]
    if: needs.validate.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - run: git archive --format=tar.gz --output=dist/SOURCE.tar.gz HEAD
      - run: node build/verify-release.mjs
        env:
          OSTRM_VERSION: ${{ needs.validate.outputs.version }}
      - run: python3 build/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
